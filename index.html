<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0];
const SL=['head','chest','gloves','legs','boots','amu1','amu2','amu3','lhand','rhand'];
const SLN={head:'Helmet',chest:'Chest',gloves:'Gloves',legs:'Trousers',boots:'Boots',amu1:'Amulet',amu2:'Amulet',amu3:'Amulet',lhand:'Left hand',rhand:'Right hand'};
const SLOTOF={head:['head'],chest:['chest'],gloves:['gloves'],legs:['legs'],boots:['boots'],amulet:['amu1','amu2','amu3'],weapon:['lhand','rhand'],shield:['lhand','rhand']};
const RC=['#8a8499','#4cc46a','#4aa0ff','#c06bff','#ff9a2e','#ff4f8b'],RN=['Common','Uncommon','Rare','Epic','Legendary','Mythic'];

const PRE=[['Worn','Frayed','Rusty'],['Sturdy','Hardy','Keen'],['Gleaming','Fine','Honed'],['Runed','Warded','Vicious'],['Mythic','Ancient','Dawnforged'],['Eternal','Primal','Godforged']];
const BASE={head:['Cap','Helm','Hood','Crown'],chest:['Tunic','Mail','Plate','Robe'],gloves:['Mitts','Gauntlets','Wraps'],legs:['Breeches','Greaves','Trousers'],boots:['Boots','Sandals','Treads'],amulet:['Charm','Amulet','Talisman','Locket'],weapon:['Sword','Axe','Dagger','Mace','Spear'],shield:['Buckler','Shield','Aegis']};
const TT={head:{def:1,hp:1.5},chest:{def:1.5,hp:3},gloves:{atk:.6,def:.6},legs:{def:1,hp:2},boots:{def:.6,spd:1.5},amulet:{atk:.6,hp:1.5,crit:1.2},weapon:{atk:2,crit:.5},shield:{def:1.6,hp:2}};

const SUFS={'of the Fox':'dodge','of the Bear':'hp','of Embers':'atk','of the Deep':'mpr','of Storms':'spd','of the Wyrm':'def','of Ruin':'crit','of Thieves':'gf','of Leeches':'ls','of Briars':'thorn','of Venom':'poison'};

const TR=[{k:'might',n:'Might',d:'+12% attack (multiplicative)',b:25},{k:'vigor',n:'Vigor',d:'+15% health (multiplicative)',b:25},{k:'grit',n:'Grit',d:'+10% defense (multiplicative)',b:30},{k:'arcana',n:'Arcana',d:'+20% spell power, +10 mana',b:60,m:1}];
const NM=['Slime','Bat','Goblin','Skeleton','Ogre'],TP=['Mossy','Cave','Ashen','Frost','Ember','Void'];

let S,run=null,mode='camp',tab='g',uid=1,forgeSelected=[],forgeMode=false;
function def(){return{gold:0,best:0,bestOverall:0,tr:{},eq:{rhand:{id:0,ty:'weapon',ri:0,il:1,nm:'Rusty Sword',st:{atk:2}}},bag:[],magic:false,petsOn:false,pets:[{own:0,lvl:0},{own:0,lvl:0},{own:0,lvl:0}],ap:-1,speed:1,uid:1,rl:{},relics:0,asc:0,life:0,sd:0,vault:[],vaultLvl:0,vaultUnlocked:false,ascBuff:null,ascDebuff:null,bagLvl:0}}
function load(){try{S=JSON.parse(localStorage.getItem('hollow-delve-2'))}catch(e){}if(!S||!S.eq)S=def();S.rl=S.rl||{};S.relics=S.relics||0;S.asc=S.asc||0;S.life=S.life||S.best||0;S.sd=S.sd||0;uid=S.uid||1;S.vault=S.vault||[];S.vaultLvl=S.vaultLvl||0;S.vaultUnlocked=S.vaultUnlocked||false;S.bestOverall=S.bestOverall||S.best||0;S.ascBuff=S.ascBuff||null;S.ascDebuff=S.ascDebuff||null;S.bagLvl=S.bagLvl||0}
function save(){S.uid=uid;try{localStorage.setItem('hollow-delve-2',JSON.stringify(S))}catch(e){}}
function rollR(b,cap=5){const w=RW.map((x,i)=>i?x*b:x).slice(0,cap+1),t=w.reduce((a,c)=>a+c);let r=Math.random()*t;let result=0;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){result=i;break}}// 2% lucky-find chance to bump up one rarity (capped at 4), stacking luck upgrades help a little
if(Math.random()<0.02+L('luck')*.003+L('mLoot')*.04&&result<5&&result<cap)result++;return result}
function gen(il,ri){const ty=pick(Object.keys(BASE)),b=(2+il*1.6)*RM[ri],st={};
 const put=(k,m)=>{const v=b*W[k]*m*(.8+Math.random()*.4);st[k]=k=='spd'?Math.round(v*1000)/1000:['crit','ls','dodge','gf','mpr'].includes(k)?Math.round(v*10)/10:Math.max(1,Math.round(v))};
 for(const k in TT[ty])put(k,TT[ty][k]);
 const ex=['atk','def','hp','crit','spd','ls','dodge','gf','thorn','mpr'].filter(k=>!(k in st)).sort(()=>Math.random()-.5);
 for(let i=0;i<ri&&i<ex.length;i++)put(ex[i],.5);
 const bn=pick(BASE[ty]);if(SPEC[bn]&&!(SPEC[bn] in st))put(SPEC[bn],.8);let sf='';if(ri>=2){sf=pick(Object.keys(SUFS));const k=SUFS[sf];if(!(k in st))put(k,.7)}return{id:uid++,ty,ri,il,nm:pick(PRE[ri])+' '+bn+(sf?' '+sf:''),st}}
// greed now gives +12% per level multiplicatively
const val=it=>Math.max(1,Math.round((2+it.il*1.6)*RM[it.ri]*1.2*Math.pow(1.12,L('greed'))*Math.pow(1.06,L('mGreed'))*(1+.15*RL('rGold'))));
const sc=s=>(s.ls||0)*5+(s.dodge||0)*4+(s.gf||0)*1.5+(s.thorn||0)+(s.mpr||0)*6+(s.atk||0)*3+(s.def||0)*2+(s.hp||0)*.3+(s.crit||0)*4+(s.spd||0)*60;
function fmt(s){const o=[];if(s.atk)o.push('+'+s.atk+' atk');if(s.def)o.push('+'+s.def+' def');if(s.hp)o.push('+'+s.hp+' hp');if(s.crit)o.push('+'+s.crit+'% crit');if(s.spd)o.push('+'+Math.round(s.spd*100)+'% speed');if(s.ls)o.push('+'+s.ls+'% lifesteal');if(s.dodge)o.push('+'+s.dodge+'% dodge');if(s.gf)o.push('+'+s.gf+'% gold find');if(s.thorn)o.push('+'+s.thorn+' thorns');if(s.mpr)o.push('+'+s.mpr+' mana/s');if(s.poison)o.push('+'+s.poison+' poison');return o.join(', ')}
// Set synergies: [setName, baseNames[], pieceThresholds[[count,bonusDesc,bonusFn]]]
const SETS=[
 ['Iron Warrior',['Helm','Mail','Gauntlets','Greaves','Boots'],[[3,'+20% defense',(s)=>{s.def*=1.2}],[5,'+35% HP + thorns',(s)=>{s.hp*=1.35;s.thorn+=s.def*.1}]]],
 ['Shadow Stalker',['Hood','Tunic','Wraps','Trousers','Treads'],[[3,'+15% dodge + speed',(s)=>{s.dodge+=15;s.spd+=.1}],[5,'+40% crit + lifesteal',(s)=>{s.crit+=20;s.ls+=8}]]],
 ['Arcane Scholar',['Crown','Robe','Wraps','Breeches','Sandals'],[[2,'+25% spell power (arcana)',(s)=>{s._spellBonus=(s._spellBonus||1)*1.25}],[4,'+50% mana regen',(s)=>{s.mpr+=s.mpr*.5+.5}]]],
 ['Lucky Wanderer',['Cap','Tunic','Mitts','Breeches','Boots'],[[3,'+20% gold find + drop chance',(s)=>{s.gf+=20;s._luckBonus=(s._luckBonus||0)+.1}],[5,'+30% all stats',(s)=>{s.atk*=1.3;s.def*=1.3;s.hp*=1.3}]]]
];
const ASC_BUFFS=[
 {k:'bloodlust',n:'Bloodlust',d:'+30% attack',fn:(s)=>{s.atk*=1.3}},
 {k:'ironhide',n:'Iron Hide',d:'+40% health',fn:(s)=>{s.hp*=1.4}},
 {k:'swiftness',n:'Swiftness',d:'+25% attack speed',fn:(s)=>{s.spd=Math.min(1.5,s.spd+.25)}},
 {k:'sharpened',n:'Sharpened',d:'+20% crit chance',fn:(s)=>{s.crit=Math.min(75,s.crit+20)}},
 {k:'fortune',n:'Fortune\'s Smile',d:'+25% gold find',fn:(s)=>{s.gf+=25}},
 {k:'thorn_wall',n:'Thorn Wall',d:'+30% defense',fn:(s)=>{s.def*=1.3}},
 {k:'lifesteal',n:'Vampiric',d:'+10% lifesteal',fn:(s)=>{s.ls+=10}},
 {k:'evasion',n:'Ghost Step',d:'+15% dodge',fn:(s)=>{s.dodge=Math.min(50,s.dodge+15)}},

 {k:'brittle',n:'Brittle',d:'-20% max health',fn:(s)=>{s.hp*=0.8}},
 {k:'sluggish',n:'Sluggish',d:'-15% attack speed',fn:(s)=>{s.spd=Math.max(0,s.spd-.15)}},
 {k:'poverty',n:'Poverty',d:'-20% gold rewards',fn:()=>{}}, // applied in kill()

 {k:'clumsy',n:'Clumsy',d:'-10% crit chance',fn:(s)=>{s.crit=Math.max(0,s.crit-10)}},

 {k:'leaden',n:'Leaden Feet',d:'-10% dodge',fn:(s)=>{s.dodge=Math.max(0,s.dodge-10)}},

function rollAscModifiers(){const b=ASC_BUFFS[Math.floor(Math.random()*ASC_BUFFS.length)];let d;do{d=ASC_DEBUFFS[Math.floor(Math.random()*ASC_DEBUFFS.length)]}while(d.k===b.k);return{buff:b.k,debuff:d.k}}
function setSynergyBonuses(s){const names={};for(const sl of SL){const it=S.eq[sl];if(it){const base=it.nm.replace(/^\w+ /,'').replace(/ of .+/,'');names[base]=(names[base]||0)+1}}for(const[,bases,tiers]of SETS){const count=bases.reduce((n,b)=>(names[b]||0)+n,0);for(const[thresh,,fn]of tiers)if(count>=thresh)fn(s)}}
function activeSynergies(){const names={};for(const sl of SL){const it=S.eq[sl];if(it){const base=it.nm.replace(/^\w+ /,'').replace(/ of .+/,'');names[base]=(names[base]||0)+1}}const out=[];for(const[nm,bases,tiers]of SETS){const count=bases.reduce((n,b)=>(names[b]||0)+n,0);for(const[thresh,desc]of tiers)if(count>=thresh)out.push(nm+' ('+thresh+'pc): '+desc)}return out}
function stats(){
 // Base stats from gear first so % upgrades multiply on top
 const gearAtk=Object.values(S.eq).reduce((t,it)=>t+(it?.st?.atk||0),0)||0;
 const gearDef=Object.values(S.eq).reduce((t,it)=>t+(it?.st?.def||0),0)||0;
 const gearHp=Object.values(S.eq).reduce((t,it)=>t+(it?.st?.hp||0),0)||0;
 const baseAtk=3+gearAtk, baseDef=gearDef||1, baseHp=30+gearHp;
 // % multipliers from upgrades (each level = +12% atk, +15% hp, +10% def, +8% spd, +8% crit, +4% regen)
 const mightMult=Math.pow(1.12,L('might'))*Math.pow(1.06,L('mMight')),vigorMult=Math.pow(1.15,L('vigor'))*Math.pow(1.06,L('mVigor')),gritMult=Math.pow(1.10,L('grit'));
 const s={atk:baseAtk*mightMult,def:baseDef*gritMult,hp:baseHp*vigorMult,crit:5*Math.pow(1.08,L('fury')),spd:L('haste')*.05,ls:0,dodge:0,gf:0,thorn:0,mpr:0,poison:0,_spellBonus:1,_luckBonus:0};
 for(const sl of SL){const it=S.eq[sl];if(it)for(const k in it.st)if(!['atk','def','hp'].includes(k))s[k]+=it.st[k]}
 setSynergyBonuses(s);
 if(S.ascBuff){const b=ASC_BUFFS.find(x=>x.k===S.ascBuff);if(b)b.fn(s)}

const TREE=[

 else if(a=='camp'){S.bag.push(...run.loot);run.loot=[];const bc=bagCap();while(S.bag.length>bc&&bc!==Infinity){let m=0;S.bag.forEach((x,i)=>{if(val(x)<val(S.bag[m]))m=i});sell(S.bag[m].id)}mode='camp';run=null;view()}
 else if(a=='spd'){S.speed=S.speed>=maxSpd()?1:S.speed*2}else if(a=='end'){if(run&&!run.over){run.hp=0;die()}}else if(a=='reset'){if(b.dataset.c){S=def();uid=1;tab='g';save();camp()}else{b.dataset.c=1;b.textContent='Tap again to erase all progress';setTimeout(()=>{delete b.dataset.c;b.textContent='Reset save'},4000)}}
 else if(a=='cast')cast(+v);
 else{if(a=='eq')equip(v);if(a=='sell')sell(v);if(a=='un'){const it=S.eq[v];delete S.eq[v];S.bag.push(it)}
  if(a=='best'&&L('tidy'))autoEquip();if(a=='sellr'&&L('bulk'+(+v+1)))sellBelow(+v);if(a=='asc')ascend();
  if(a=='lbClear'){try{localStorage.removeItem('hd-lb')}catch(e){}}
  if(a=='bagUp'){const c=bagUpgradeCost();if(S.gold>=c&&bagCap()!==Infinity){S.gold-=c;S.bagLvl++}}
  if(a=='forgeOpen'){forgeMode=true;forgeSelected=[]}
  if(a=='forgeClose'){forgeMode=false;forgeSelected=[]}
  if(a=='fSel'){const id=+v;if(forgeSelected.includes(id)){forgeSelected=forgeSelected.filter(x=>x!==id)}else if(forgeSelected.length<3)forgeSelected.push(id)}
  if(a=='forgeClear')forgeSelected=[];
  if(a=='forge'){const ids=forgeSelected;if(ids.length===3){const items=ids.map(id=>S.bag.find(x=>x.id===id));const valid=items.every(it=>it&&it.ri===items[0].ri&&it.ty===items[0].ty&&it.ri<5);if(valid){const newRi=items[0].ri+1,avgIl=Math.round(items.reduce((s,x)=>s+x.il,0)/3);for(const id of ids){const i=S.bag.findIndex(x=>x.id===id);if(i>=0)S.bag.splice(i,1)}S.bag.push(gen(avgIl,newRi));forgeSelected=[]}}}
  if(a=='vUnlock'&&S.gold>=vaultUnlockCost()){S.gold-=vaultUnlockCost();S.vaultUnlocked=true}
  if(a=='vUp'&&S.gold>=vaultUpgradeCost()){S.gold-=vaultUpgradeCost();S.vaultLvl++}
  if(a=='vIn'){const i=S.bag.findIndex(x=>x.id==+v);if(i>=0&&S.vault.length<vaultCap()){S.vault.push(S.bag[i]);S.bag.splice(i,1)}}
  if(a=='vOut'){const i=S.vault.findIndex(x=>x.id==+v);if(i>=0){S.bag.push(S.vault[i]);S.vault.splice(i,1)}}if(a=='qm')S.qmT=Math.max(0,Math.min(L('sorter'),qmT()+ +v));if(a=='sd')S.sd=Math.max(0,Math.min(RL('rStart'),(S.sd||0)+ +v));if(a=='respec'){let t=0;for(const n of RTREE)for(let i=0;i<RL(n.k);i++)t+=Math.max(1,Math.round(n.b*Math.pow(n.g,i)));S.relics+=t;S.rl={};S.sd=0}if(a=='rb'){const n=RT[v],c=rcost(n);if(RL(v)<n.m&&S.relics>=c){S.relics-=c;S.rl[v]=RL(v)+1;if(v=='rMagic')S.magic=true;}}if(a=='tab'){tab=v;if(v!=='g'){forgeMode=false;forgeSelected=[]}}
  if(a=='tr'){const n=NODE[v],c=cost(n);const needsMagic=['arcana','mender','frost'].includes(v);if(can(n)&&L(v)<n.m&&S.gold>=c&&(!needsMagic||hasMagic())){S.gold-=c;S.tr[v]=L(v)+1}}
  
  if(a=='magic'&&!hasMagic()&&S.gold>=300&&S.best>=6){S.gold-=300;S.magic=true}
  if(a=='bp'){S.gold-=PET[v].cost;S.pets[v].own=1;S.ap=+v}if(a=='ap')S.ap=+v;
  if(a=='pl'&&S.gold>=petLc(+v)){S.gold-=petLc(+v);S.pets[v].lvl++}
  save();camp()}});
load();view();requestAnimationFrame(loop);
</script></body></html>

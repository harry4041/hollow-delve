<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hollow Delve</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8e0cc;
      --panel: #f6f0de;
      --ink: #1d1633;
      --mute: #6b6285;
      --btn: #ffd34d;
      --btnt: #1d1633;
      --hp: #d94a4a;
      --mp: #3a7bd9;
      --gold: #9a6200;
      --c0: #6b6285;
      --c1: #2a8c43;
      --c2: #2a72c4;
      --c3: #9035c4;
      --c4: #d4650a;
      color-scheme: light dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #150f26;
        --panel: #241a3f;
        --ink: #efe6cf;
        --mute: #9a90b8;
        --btn: #ffb52e;
        --gold: #ffd34d;
        --c0: #9a90b8;
        --c1: #5fd37a;
        --c2: #5fb0ff;
        --c3: #cf80ff;
        --c4: #ff9a2e
      }
    }

    :root[data-theme="dark"] {
      --bg: #150f26;
      --panel: #241a3f;
      --ink: #efe6cf;
      --mute: #9a90b8;
      --btn: #ffb52e;
      --gold: #ffd34d;
      --c0: #9a90b8;
      --c1: #5fd37a;
      --c2: #5fb0ff;
      --c3: #cf80ff;
      --c4: #ff9a2e
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 21px/1.15 'VT323', ui-monospace, monospace
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 10px
    }

    h1,
    h2,
    .px {
      font-family: 'Press Start 2P', ui-monospace, monospace;
      font-weight: 400
    }

    h1 {
      font-size: 14px;
      margin: 4px 0
    }

    h2 {
      font-size: 10px;
      margin: 14px 0 6px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    #top {
      text-align: right;
      color: var(--gold);
      white-space: nowrap
    }

    .box {
      background: var(--panel);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      padding: 8px;
      margin: 10px 4px 10px 0
    }

    .cv {
      position: relative;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      margin: 8px 4px 8px 0;
      background: #000
    }

    canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      aspect-ratio: 16/9
    }

    button {
      font: inherit;
      color: var(--btnt);
      background: var(--btn);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 4px 10px;
      cursor: pointer;
      min-height: 36px
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    button:disabled {
      opacity: .45;
      cursor: default
    }

    button.s {
      min-height: 28px;
      padding: 1px 8px;
      font-size: 19px
    }

    button.alt {
      background: var(--panel);
      color: var(--ink)
    }

    .bar {
      position: relative;
      height: 18px;
      border: 2px solid var(--ink);
      background: #0006;
      margin: 4px 0
    }

    .bar i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: var(--hp)
    }

    .bar.m i {
      background: var(--mp)
    }

    .bar.e i {
      background: #c9892b
    }

    .bar span {
      position: absolute;
      inset: 0;
      text-align: center;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
      line-height: 14px
    }

    .row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .row.sp {
      justify-content: space-between
    }

    #feed,
    #last {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      min-height: 26px
    }

    .chip {
      border: 2px solid;
      padding: 0 5px;
      font-size: 18px
    }

    #over {
      position: absolute;
      inset: 0;
      background: #000c;
      color: #efe6cf;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center
    }

    #over[hidden] {
      display: none
    }

    .slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px
    }

    .sl {
      border: 2px dashed var(--mute);
      padding: 3px 6px;
      min-height: 50px;
      cursor: pointer
    }

    .sl.f {
      border-style: solid
    }

    .sl small,
    .it small {
      color: var(--mute);
      display: block
    }

    .it {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center;
      padding: 4px 0;
      border-bottom: 2px dotted var(--mute)
    }

    .up {
      color: var(--c1)
    }

    .dn {
      color: #d94a4a
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .tabs button.on {
      background: var(--ink);
      color: var(--bg)
    }

    .mute {
      color: var(--mute)
    }

    .lk {
      opacity: .5
    }

    @media (prefers-reduced-motion:reduce) {
      button:active {
        transform: none
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>Hollow Delve</h1>
      <div id="top"></div>
    </header>
    <section id="battle" hidden>
      <div class="cv"><canvas id="c" width="160" height="90"></canvas>
        <div id="over" hidden>
          <div class="px" style="font-size:12px">Defeated</div>
          <div id="ovt"></div><button data-a="camp">Go to camp</button>
        </div>
      </div>
      <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>
      <div class="bar m" id="mpw"><i id="mpb"></i><span id="mpt"></span></div>
      <div class="bar e"><i id="ehb"></i><span id="ent"></span></div>
      <div class="row sp" style="margin:6px 0">
        <div class="row" id="spells"></div>
        <div class="row"><button class="s alt" data-a="spd" id="spdb"></button><button class="s alt" data-a="end">End
            run</button></div>
      </div>
      <div class="mute">Last drop</div>
      <div id="last"></div>
      <div class="mute" style="margin-top:6px">Loot this run</div>
      <div id="feed"></div>
    </section>
    <section id="camp" hidden>
      <div class="row sp">
        <div class="tabs"><button data-a="tab" data-v="g" id="tg">Gear</button><button data-a="tab" data-v="u"
            id="tu">Upgrades</button><button data-a="tab" data-v="v" id="tv">Vault</button><button data-a="tab"
            data-v="a" id="ta">Ascend</button></div><button data-a="delve">Delve</button>
      </div>
      <div id="sdw" class="row" style="margin:6px 0"></div>
      <div id="cbody"></div>
      <div style="margin:16px 0"><button class="s alt" data-a="reset">Reset save</button></div>
    </section>
  </div>
  <script>
    const $ = s => document.querySelector(s), pick = a => a[Math.random() * a.length | 0];
    const SL = ['head', 'chest', 'gloves', 'legs', 'boots', 'amu1', 'amu2', 'amu3', 'lhand', 'rhand'];
    const SLN = {head: 'Helmet', chest: 'Chest', gloves: 'Gloves', legs: 'Trousers', boots: 'Boots', amu1: 'Amulet', amu2: 'Amulet', amu3: 'Amulet', lhand: 'Left hand', rhand: 'Right hand'};
    const SLOTOF = {head: ['head'], chest: ['chest'], gloves: ['gloves'], legs: ['legs'], boots: ['boots'], amulet: ['amu1', 'amu2', 'amu3'], weapon: ['lhand', 'rhand'], shield: ['lhand', 'rhand']};
    const RC = ['#8a8499', '#4cc46a', '#4aa0ff', '#c06bff', '#ff9a2e'], RN = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
    const RM = [1, 1.5, 2.2, 3.2, 4.8], RW = [60, 25, 10, 4, 1.2];
    const PRE = [['Worn', 'Frayed', 'Rusty'], ['Sturdy', 'Hardy', 'Keen'], ['Gleaming', 'Fine', 'Honed'], ['Runed', 'Warded', 'Vicious'], ['Mythic', 'Ancient', 'Dawnforged']];
    const BASE = {head: ['Cap', 'Helm', 'Hood', 'Crown'], chest: ['Tunic', 'Mail', 'Plate', 'Robe'], gloves: ['Mitts', 'Gauntlets', 'Wraps'], legs: ['Breeches', 'Greaves', 'Trousers'], boots: ['Boots', 'Sandals', 'Treads'], amulet: ['Charm', 'Amulet', 'Talisman', 'Locket'], weapon: ['Sword', 'Axe', 'Dagger', 'Mace', 'Spear'], shield: ['Buckler', 'Shield', 'Aegis']};
    const TT = {head: {def: 1, hp: 1.5}, chest: {def: 1.5, hp: 3}, gloves: {atk: .6, def: .6}, legs: {def: 1, hp: 2}, boots: {def: .6, spd: 1.5}, amulet: {atk: .6, hp: 1.5, crit: 1.2}, weapon: {atk: 2, crit: .5}, shield: {def: 1.6, hp: 2}};
    const W = {atk: .7, def: .7, hp: 3, crit: .12, spd: .0035, ls: .05, dodge: .06, gf: .2, thorn: .4, mpr: .02, poison: .08};
    const SPEC = {Dagger: 'spd', Axe: 'atk', Spear: 'crit', Mace: 'thorn', Robe: 'mpr', Crown: 'gf', Hood: 'dodge', Aegis: 'thorn', Locket: 'ls', Talisman: 'mpr', Treads: 'dodge', Sandals: 'spd', Wraps: 'crit', Gauntlets: 'thorn', Charm: 'gf', Amulet: 'ls', Plate: 'def'};
    const SUFS = {'of the Fox': 'dodge', 'of the Bear': 'hp', 'of Embers': 'atk', 'of the Deep': 'mpr', 'of Storms': 'spd', 'of the Wyrm': 'def', 'of Ruin': 'crit', 'of Thieves': 'gf', 'of Leeches': 'ls', 'of Briars': 'thorn', 'of Venom': 'poison'};
    const SP = [{n: 'Fireball', c: 20, cd: 4}, {n: 'Mend', c: 30, cd: 8}, {n: 'Frost', c: 25, cd: 10}];
    const PET = [{n: 'Pip the slime', d: .2, iv: 1.2, cost: 1500, c: '#5fe08a'}, {n: 'Fang the wolf', d: .45, iv: 1, cost: 9000, c: '#b9b3c9'}, {n: 'Ember the drake', d: .9, iv: .9, cost: 40000, c: '#ff7a3a'}];
    const TR = [{k: 'might', n: 'Might', d: '+2 attack', b: 25}, {k: 'vigor', n: 'Vigor', d: '+12 health', b: 25}, {k: 'grit', n: 'Grit', d: '+1.5 defense', b: 30}, {k: 'arcana', n: 'Arcana', d: '+spell power, +10 mana', b: 60, m: 1}];
    const NM = ['Slime', 'Bat', 'Goblin', 'Skeleton', 'Ogre'], TP = ['Mossy', 'Cave', 'Ashen', 'Frost', 'Ember', 'Void'];
    const TINT = ['#5fbf6a', '#8a6fd0', '#d0a040', '#6fb7d8', '#e0603a', '#a04fd0'];
    const SKY = [['#1b1530', '#2a2050', '#342a62', '#2d3b2a', '#4f7a3a'], ['#10203a', '#183456', '#1f4468', '#34303a', '#5a566a'], ['#2a1810', '#4a2a1a', '#5d3822', '#3a2a20', '#7a5a3a'], ['#10283a', '#1a4258', '#235a74', '#3a4a58', '#8ab0c8'], ['#2a0e10', '#4a1a1a', '#662424', '#2a1a1a', '#a03a1a'], ['#0e0a1a', '#1a1030', '#281848', '#1a1428', '#4a2a6a']];
    let S, run = null, mode = 'camp', tab = 'g', uid = 1;
    function def() {return {gold: 0, best: 0, bestOverall: 0, tr: {}, eq: {rhand: {id: 0, ty: 'weapon', ri: 0, il: 1, nm: 'Rusty Sword', st: {atk: 2}}}, bag: [], magic: false, petsOn: false, pets: [{own: 0, lvl: 0}, {own: 0, lvl: 0}, {own: 0, lvl: 0}], ap: -1, speed: 1, uid: 1, rl: {}, relics: 0, asc: 0, life: 0, sd: 0, vault: [], vaultLvl: 0, vaultUnlocked: false}}
    function load() {try {S = JSON.parse(localStorage.getItem('hollow-delve-2'))} catch (e) { } if (!S || !S.eq) S = def(); S.rl = S.rl || {}; S.relics = S.relics || 0; S.asc = S.asc || 0; S.life = S.life || S.best || 0; S.sd = S.sd || 0; uid = S.uid || 1; S.vault = S.vault || []; S.vaultLvl = S.vaultLvl || 0; S.vaultUnlocked = S.vaultUnlocked || false; S.bestOverall = S.bestOverall || S.best || 0}
    function save() {S.uid = uid; try {localStorage.setItem('hollow-delve-2', JSON.stringify(S))} catch (e) { } }
    function rollR(b, cap = 4) {
      const w = RW.map((x, i) => i ? x * b : x).slice(0, cap + 1), t = w.reduce((a, c) => a + c); let r = Math.random() * t; let result = 0; for (let i = 0; i < w.length; i++) {r -= w[i]; if (r <= 0) {result = i; break} }// 2% lucky-find chance to bump up one rarity (capped at 4), stacking luck upgrades help a little
      if (Math.random() < 0.02 + L('luck') * .003 && result < 4 && result < cap) result++; return result
    }
    function gen(il, ri) {
      const ty = pick(Object.keys(BASE)), b = (2 + il * 1.6) * RM[ri], st = {};
      const put = (k, m) => {const v = b * W[k] * m * (.8 + Math.random() * .4); st[k] = k == 'spd' ? Math.round(v * 1000) / 1000 : ['crit', 'ls', 'dodge', 'gf', 'mpr'].includes(k) ? Math.round(v * 10) / 10 : Math.max(1, Math.round(v))};
      for (const k in TT[ty]) put(k, TT[ty][k]);
      const ex = ['atk', 'def', 'hp', 'crit', 'spd', 'ls', 'dodge', 'gf', 'thorn', 'mpr'].filter(k => !(k in st)).sort(() => Math.random() - .5);
      for (let i = 0; i < ri && i < ex.length; i++)put(ex[i], .5);
      const bn = pick(BASE[ty]); if (SPEC[bn] && !(SPEC[bn] in st)) put(SPEC[bn], .8); let sf = ''; if (ri >= 2) {sf = pick(Object.keys(SUFS)); const k = SUFS[sf]; if (!(k in st)) put(k, .7)} return {id: uid++, ty, ri, il, nm: pick(PRE[ri]) + ' ' + bn + (sf ? ' ' + sf : ''), st}
    }
    const val = it => Math.max(1, Math.round((2 + it.il * 1.6) * RM[it.ri] * 1.2 * (1 + .1 * L('greed')) * (1 + .15 * RL('rGold'))));
    const sc = s => (s.ls || 0) * 5 + (s.dodge || 0) * 4 + (s.gf || 0) * 1.5 + (s.thorn || 0) + (s.mpr || 0) * 6 + (s.atk || 0) * 3 + (s.def || 0) * 2 + (s.hp || 0) * .3 + (s.crit || 0) * 4 + (s.spd || 0) * 60;
    function fmt(s) {const o = []; if (s.atk) o.push('+' + s.atk + ' atk'); if (s.def) o.push('+' + s.def + ' def'); if (s.hp) o.push('+' + s.hp + ' hp'); if (s.crit) o.push('+' + s.crit + '% crit'); if (s.spd) o.push('+' + Math.round(s.spd * 100) + '% speed'); if (s.ls) o.push('+' + s.ls + '% lifesteal'); if (s.dodge) o.push('+' + s.dodge + '% dodge'); if (s.gf) o.push('+' + s.gf + '% gold find'); if (s.thorn) o.push('+' + s.thorn + ' thorns'); if (s.mpr) o.push('+' + s.mpr + ' mana/s'); if (s.poison) o.push('+' + s.poison + ' poison'); return o.join(', ')}
    // Set synergies: [setName, baseNames[], pieceThresholds[[count,bonusDesc,bonusFn]]]
    const SETS = [
      ['Iron Warrior', ['Helm', 'Mail', 'Gauntlets', 'Greaves', 'Boots'], [[3, '+20% defense', (s) => {s.def *= 1.2}], [5, '+35% HP + thorns', (s) => {s.hp *= 1.35; s.thorn += s.def * .1}]]],
      ['Shadow Stalker', ['Hood', 'Tunic', 'Wraps', 'Trousers', 'Treads'], [[3, '+15% dodge + speed', (s) => {s.dodge += 15; s.spd += .1}], [5, '+40% crit + lifesteal', (s) => {s.crit += 20; s.ls += 8}]]],
      ['Arcane Scholar', ['Crown', 'Robe', 'Wraps', 'Breeches', 'Sandals'], [[2, '+25% spell power (arcana)', (s) => {s._spellBonus = (s._spellBonus || 1) * 1.25}], [4, '+50% mana regen', (s) => {s.mpr += s.mpr * .5 + .5}]]],
      ['Lucky Wanderer', ['Cap', 'Tunic', 'Mitts', 'Breeches', 'Boots'], [[3, '+20% gold find + drop chance', (s) => {s.gf += 20; s._luckBonus = (s._luckBonus || 0) + .1}], [5, '+30% all stats', (s) => {s.atk *= 1.3; s.def *= 1.3; s.hp *= 1.3}]]]
    ];
    function setSynergyBonuses(s) {const names = {}; for (const sl of SL) {const it = S.eq[sl]; if (it) {const base = it.nm.replace(/^\w+ /, '').replace(/ of .+/, ''); names[base] = (names[base] || 0) + 1} } for (const [, bases, tiers] of SETS) {const count = bases.reduce((n, b) => (names[b] || 0) + n, 0); for (const [thresh, , fn] of tiers) if (count >= thresh) fn(s)} }
    function activeSynergies() {const names = {}; for (const sl of SL) {const it = S.eq[sl]; if (it) {const base = it.nm.replace(/^\w+ /, '').replace(/ of .+/, ''); names[base] = (names[base] || 0) + 1} } const out = []; for (const [nm, bases, tiers] of SETS) {const count = bases.reduce((n, b) => (names[b] || 0) + n, 0); for (const [thresh, desc] of tiers) if (count >= thresh) out.push(nm + ' (' + thresh + 'pc): ' + desc)} return out}
    function stats() {
      const s = {atk: 3 + L('might') * 2, def: L('grit') * 1.5, hp: 30 + L('vigor') * 12, crit: 5 + L('fury') * 2, spd: L('haste') * .05, ls: 0, dodge: 0, gf: 0, thorn: 0, mpr: 0, poison: 0, _spellBonus: 1, _luckBonus: 0};
      for (const sl of SL) {const it = S.eq[sl]; if (it) for (const k in it.st) s[k] += it.st[k]}
      setSynergyBonuses(s);
      const pm = 1 + .1 * RL('rPow'); s.dodge = Math.min(50, s.dodge); s.atk *= pm; s.hp *= pm; s.crit = Math.min(75, s.crit); s.spd = Math.min(1.5, s.spd); return s
    }
    const L = k => S.tr[k] || 0, RL = k => (S.rl && S.rl[k]) || 0; const mpMax = () => 60 + L('arcana') * 10;
    const TREE = [
      {k: 'might', n: 'Might', d: '+2 attack', m: 10, b: 40, g: 1.7, r: {}},
      {k: 'vigor', n: 'Vigor', d: '+12 health', m: 10, b: 40, g: 1.7, r: {}},
      {k: 'grit', n: 'Grit', d: '+1.5 defense', m: 10, b: 80, g: 1.75, r: {vigor: 2}},
      {k: 'regen', n: 'Recovery', d: '+3% max health restored after each kill', m: 8, b: 100, g: 1.8, r: {vigor: 1}},
      {k: 'haste', n: 'Haste', d: '+5% attack speed', m: 6, b: 150, g: 1.9, r: {might: 2}},
      {k: 'fury', n: 'Fury', d: '+2% crit chance', m: 8, b: 250, g: 1.9, r: {might: 4}},
      {k: 'sim1', n: 'Fast forward', d: 'Unlocks x2 battle speed', m: 1, b: 500, g: 1, r: {haste: 2}},
      {k: 'sim2', n: 'Time rush', d: 'Unlocks x4 battle speed', m: 1, b: 4000, g: 1, r: {sim1: 1, haste: 4}},
      {k: 'greed', n: 'Greed', d: '+10% gold and sale value', m: 8, b: 120, g: 1.85, r: {vigor: 2}},
      {k: 'eyes', n: 'Keen eyes', d: '+5% loot drop chance', m: 8, b: 220, g: 1.85, r: {greed: 1}},
      {k: 'luck', n: 'Fortune', d: 'Rare loot drops more often', m: 8, b: 600, g: 2, r: {eyes: 2, greed: 3}},
      {k: 'plunder', n: 'Plunder', d: '+1 loot roll per enemy', m: 8, b: 350, g: 1.9, r: {eyes: 1}},
      {k: 'sorter', n: 'Quartermaster', d: 'Auto-sells drops up to a rarity tier', m: 4, b: 300, g: 3, r: {greed: 2}},
      {k: 'sort', n: 'Bag sorting', d: 'Sorts the bag by rarity and level', m: 1, b: 3000, g: 1, r: {vigor: 3}},
      {k: 'tidy', n: 'Quick equip', d: 'Unlocks the Equip upgrades button', m: 1, b: 5000, g: 1, r: {vigor: 3, might: 2}},
      {k: 'bulk1', n: 'Bulk sell I', d: 'Unlocks Sell common', m: 1, b: 350, g: 1, r: {tidy: 1}},
      {k: 'bulk2', n: 'Bulk sell II', d: 'Unlocks Sell uncommon and below', m: 1, b: 1500, g: 1, r: {bulk1: 1}},
      {k: 'bulk3', n: 'Bulk sell III', d: 'Unlocks Sell rare and below', m: 1, b: 6000, g: 1, r: {bulk2: 1}},
      {k: 'arcana', n: 'Arcana', d: '+10 mana, stronger spells (requires Arcane Awakening relic)', m: 8, b: 200, g: 1.85, r: {}},
      {k: 'mender', n: 'Mend', d: 'Unlocks the healing spell', m: 1, b: 1200, g: 1, r: {arcana: 2}},
      {k: 'frost', n: 'Frost', d: 'Unlocks the stun spell', m: 1, b: 2200, g: 1, r: {arcana: 4}},
      {k: 'den', n: 'Pet den', d: 'Unlocks companions', m: 1, b: 2000, g: 1, r: {vigor: 4, greed: 2}},

        const q = sh(k, x, y, w, h, 0); R(q[0] + o - 1, q[1] - 1, q[2] + 2, q[3] + 2, '#000a'); R(q[0] + o, q[1], q[2], q[3], c)
      })
    }
    function draw() {
      const r = run, t = r.t, tier = Math.floor((r.stage - 1) / 5) % 6, k = SKY[tier];
      R(0, 0, 160, 90, k[0]); R(0, 38, 160, 32, k[1]); for (const s of STARS) R(s[0], s[1], 1, 1, '#ffffff66');
      for (let x = 0; x < 160; x += 4) {const h = 18 + Math.sin(x * .07) * 9 + Math.sin(x * .19) * 5; R(x, 70 - h, 4, h, k[2])}
      R(0, 70, 160, 20, k[3]); R(0, 70, 160, 2, k[4]); for (let x = -(t * 20 % 16); x < 160; x += 16)R(x, 80, 6, 1, k[4]);
      if (S.ap >= 0) {const P = PET[S.ap], b = Math.sin(t * 8) > 0 ? 0 : 1; R(14, 79 - b, 10, 6, P.c); R(21, 77 - b, 5, 4, P.c); R(23, 78 - b, 1, 1, '#111')}
      const hx = 36 + (r.lunge > 0 ? 8 : 0); if (r.hf > 0) g.globalAlpha = .5; drawHero(hx, 78, t); g.globalAlpha = 1;
      const ex = (r.boss ? 96 : 108) - (r.elunge > 0 ? 8 : 0); drawEnemy(r.eType, ex, 78, r.ef > 0 ? '#fff' : r.eType == 3 ? '#c9c4b4' : TINT[tier], t); wear(r.eType, ex, r.eDrops, t);
      if (r.stun > 0) R(ex, 40, 30, 2, '#6ecbf5');
      for (const o of r.orbs) R(o.x, o.y, 3, 3, o.c);
      g.font = 'bold 8px monospace'; g.textAlign = 'center'; for (const f of r.fx) {g.globalAlpha = 1 - f.a / .8; g.fillStyle = '#000'; g.fillText(f.t, f.x + 1, f.y + 1); g.fillStyle = f.c; g.fillText(f.t, f.x, f.y)} g.globalAlpha = 1
    }
    function hud() {
      const st = stats(), r = run; $('#hpb').style.width = r.hp / st.hp * 100 + '%'; $('#hpt').textContent = Math.ceil(r.hp) + ' / ' + Math.round(st.hp);
      $('#mpw').hidden = !hasMagic(); $('#mpb').style.width = r.mp / mpMax() * 100 + '%'; $('#mpt').textContent = Math.floor(r.mp) + ' mana';
      $('#ehb').style.width = Math.max(0, r.eHp / r.eMax * 100) + '%'; $('#ent').textContent = (r.boss ? 'BOSS · ' : '') + 'Stage ' + r.stage + ' · ' + ename() + ' · ' + r.eDrops.length + ' loot';
      $('#top').innerHTML = S.gold + ' gold<br><span class="mute">best ' + S.best + ' · all-time ' + S.bestOverall + '</span>'; $('#spdb').hidden = maxSpd() < 2; $('#spdb').textContent = 'Speed x' + Math.min(S.speed, maxSpd());
      document.querySelectorAll('#spells button').forEach(b => {const i = +b.dataset.v; b.disabled = r.over || r.cd[i] > 0 || r.mp < SP[i].c; b.textContent = SP[i].n + (r.cd[i] > 0 ? ' ' + Math.ceil(r.cd[i]) : '')})
    }
    let last = 0, sv = 0; function loop(ts) {
      const dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts;
      if (mode == 'battle' && run) {const n = Math.min(S.speed, maxSpd()); for (let i = 0; i < n; i++)tick(dt); draw(); hud(); sv += dt; if (sv > 5) {sv = 0; save()} }
      requestAnimationFrame(loop)
    }
    /* ---------- camp ---------- */
    const chip = it => '<b style="color:' + RC[it.ri] + '">' + it.nm + '</b>';
    function view() {
      $('#battle').hidden = mode != 'battle'; $('#camp').hidden = mode != 'camp';
      $('#spells').innerHTML = SP.map((s, i) => hasSp(i) ? '<button class="s" data-a="cast" data-v="' + i + '">' + s.n + '</button>' : '').join('');
      if (mode == 'camp') camp(); else hud()
    }
    function camp() {
      const st = stats(); $('#sdw').innerHTML = RL('rStart') ? '<span>Start stage</span><button class="s alt" data-a="sd" data-v="-1">-</button><b>' + startStage() + '</b><button class="s alt" data-a="sd" data-v="1">+</button>' : ''; $('#tg').className = tab == 'g' ? 'on' : ''; $('#ta').className = tab == 'a' ? 'on' : ''; $('#tv').className = tab == 'v' ? 'on' : ''; if (tab == 'v') {$('#top').innerHTML = S.gold + ' gold<br><span class="mute">best ' + S.best + '</span>'; $('#cbody').innerHTML = vaultTab(); return } if (tab == 'a') {$('#top').innerHTML = S.gold + ' gold<br><span class="mute">' + S.relics + ' relics</span>'; $('#cbody').innerHTML = ascTab(); return } $('#tu').className = tab == 'u' ? 'on' : ''; if (tab == 'u') {$('#top').innerHTML = S.gold + ' gold<br><span class="mute">best ' + S.best + ' · all-time ' + (S.bestOverall || S.best) + '</span>'; $('#cbody').innerHTML = tree(); return }
      $('#top').innerHTML = S.gold + ' gold<br><span class="mute">best ' + S.best + ' · all-time ' + (S.bestOverall || S.best) + '</span>'; let h = '';
      if (tab == 'g') {
        const syn = activeSynergies(); const synHtml = syn.length ? '<div style="margin-top:4px;color:var(--c4)">⚡ ' + syn.join(' · ') + '</div>' : '<div class="mute" style="margin-top:4px">No set bonuses active. Match base item types for synergies.</div>';
        h += '<div class="box"><div class="row sp"><span class="px" style="font-size:9px">Hero</span><span>' + Math.round(st.atk) + ' atk · ' + Math.round(st.def) + ' def · ' + Math.round(st.hp) + ' hp · ' + Math.round(st.crit) + '% crit · +' + Math.round(st.spd * 100) + '% speed</span></div>' + synHtml + '</div>';
        h += '<div class="slots">' + SL.map(sl => {const it = S.eq[sl]; return '<div class="sl' + (it ? ' f' : '') + '" ' + (it ? 'data-a="un" data-v="' + sl + '"' : '') + '><small>' + SLN[sl] + '</small>' + (it ? chip(it) + '<small>' + fmt(it.st) + '</small>' : '<span class="mute">empty</span>') + '</div>'}).join('') + '</div>';
        h += '<h2>Bag (' + S.bag.length + ')</h2><div class="mute">Uncommon drops from stage 10, rare from 25, epic from 45, legendary from 70. Bosses drop one tier higher. Lucky finds may rarely appear earlier.</div><div class="row">' + (L('tidy') ? '<button class="s" data-a="best">Equip upgrades</button>' : '') + '' + (L('bulk1') ? '<button class="s alt" data-a="sellr" data-v="0">Sell common</button>' : '') + '' + (L('bulk2') ? '<button class="s alt" data-a="sellr" data-v="1">Sell uncommon and below</button>' : '') + '' + (L('bulk3') ? '<button class="s alt" data-a="sellr" data-v="2">Sell rare and below</button>' : '<span class="mute">Bag tools unlock in Upgrades, under Camp.</span>') + '</div><div class="box">';
        const bag = L('sort') ? S.bag.slice().sort((a, b) => b.ri - a.ri || b.il - a.il) : S.bag.slice().reverse();
        h += bag.length ? bag.slice(0, 60).map(it => {const o = S.eq[target(it)], d = Math.round(sc(it.st) - (o ? sc(o.st) : 0)); return '<div class="it"><div>' + chip(it) + ' <small style="display:inline">lv' + it.il + ' <span class="' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '</span></small><small>' + fmt(it.st) + '</small></div><div class="row"><button class="s" data-a="eq" data-v="' + it.id + '">Equip</button><button class="s alt" data-a="sell" data-v="' + it.id + '">' + val(it) + 'g</button></div></div>'}).join('') + (bag.length > 60 ? '<div class="mute">+' + (bag.length - 60) + ' more hidden. Sell or equip to reveal them.</div>' : '') : '<span class="mute">Nothing here. Delve to find loot.</span>';
        h += '</div>'
      }
      else {
        h += '<h2>Training</h2><div class="box">' + TR.filter(t => !t.m || hasMagic()).map(t => {const c = Math.round(t.b * Math.pow(1.35, S.tr[t.k])); return '<div class="it"><div><b>' + t.n + ' ' + S.tr[t.k] + '</b><small>' + t.d + '</small></div><button class="s" data-a="tr" data-v="' + t.k + '" ' + (S.gold < c ? 'disabled' : '') + '>' + c + 'g</button></div>'}).join('') + '</div>';
        h += '<h2>Magic</h2><div class="box">' + (hasMagic() ? '<span>Spellcasting active! Buy Arcana upgrades below to learn Mend and Frost.</span>' : '<div class="it"><div><b>Arcane Awakening</b><small>Unlock spellcasting via the <b>Arcane Awakening</b> relic (Ascend tab). Requires first rebirth.</small></div></div>') + '</div>';
        h += '<h2>Pets</h2><div class="box">';
        if (!S.petsOn) h += '<div class="it"><div><b>Pet den</b><small>' + (S.best < 12 ? 'Reach stage 12 to unlock' : 'Companions that fight beside you') + '</small></div><button class="s" data-a="pets" ' + (S.best < 12 || S.gold < 1200 ? 'disabled' : '') + '>1200g</button></div>';
        else h += PET.map((P, i) => {const p = S.pets[i], lc = Math.round(80 * Math.pow(1.5, p.lvl) * (i + 1)); return '<div class="it"><div><b style="color:' + P.c + '">' + P.n + '</b>' + (p.own ? ' lv' + p.lvl : '') + '<small>' + Math.round(P.d * (1 + .3 * p.lvl) * 100) + '% of your attack every ' + P.iv + 's</small></div><div class="row">' + (p.own ? '<button class="s' + (S.ap == i ? '' : ' alt') + '" data-a="ap" data-v="' + i + '">' + (S.ap == i ? 'Active' : 'Send') + '</button><button class="s" data-a="pl" data-v="' + i + '" ' + (S.gold < lc ? 'disabled' : '') + '>' + lc + 'g</button>' : '<button class="s" data-a="bp" data-v="' + i + '" ' + (S.gold < P.cost ? 'disabled' : '') + '>' + P.cost + 'g</button>') + '</div></div>'}).join('');
        h += '</div>'
      }
      $('#cbody').innerHTML = h
    }
    function sellBelow(m) {S.bag = S.bag.filter(it => {if (it.ri <= m) {S.gold += val(it); return false} return true})}
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const a = b.dataset.a, v = b.dataset.v;
      if (a == 'delve') startRun();
      else if (a == 'camp') {S.bag.push(...run.loot); run.loot = []; while (S.bag.length > 300) {let m = 0; S.bag.forEach((x, i) => {if (val(x) < val(S.bag[m])) m = i}); sell(S.bag[m].id)} mode = 'camp'; run = null; view()}
      else if (a == 'spd') {S.speed = S.speed >= maxSpd() ? 1 : S.speed * 2} else if (a == 'end') {if (run && !run.over) {run.hp = 0; die()} } else if (a == 'reset') {if (b.dataset.c) {S = def(); uid = 1; tab = 'g'; save(); camp()} else {b.dataset.c = 1; b.textContent = 'Tap again to erase all progress'; setTimeout(() => {delete b.dataset.c; b.textContent = 'Reset save'}, 4000)} }
      else if (a == 'cast') cast(+v);
      else {
        if (a == 'eq') equip(v); if (a == 'sell') sell(v); if (a == 'un') {const it = S.eq[v]; delete S.eq[v]; S.bag.push(it)}
        if (a == 'best' && L('tidy')) autoEquip(); if (a == 'sellr' && L('bulk' + (+v + 1))) sellBelow(+v); if (a == 'asc') ascend();
        if (a == 'vUnlock' && S.gold >= vaultUnlockCost()) {S.gold -= vaultUnlockCost(); S.vaultUnlocked = true}
        if (a == 'vUp' && S.gold >= vaultUpgradeCost()) {S.gold -= vaultUpgradeCost(); S.vaultLvl++}
        if (a == 'vIn') {const i = S.bag.findIndex(x => x.id == +v); if (i >= 0 && S.vault.length < vaultCap()) {S.vault.push(S.bag[i]); S.bag.splice(i, 1)} }
        if (a == 'vOut') {const i = S.vault.findIndex(x => x.id == +v); if (i >= 0) {S.bag.push(S.vault[i]); S.vault.splice(i, 1)} } if (a == 'sd') S.sd = Math.max(0, Math.min(RL('rStart'), (S.sd || 0) + +v)); if (a == 'respec') {let t = 0; for (const n of RTREE) for (let i = 0; i < RL(n.k); i++)t += Math.max(1, Math.round(n.b * Math.pow(n.g, i))); S.relics += t; S.rl = {}; S.sd = 0} if (a == 'rb') {const n = RT[v], c = rcost(n); if (RL(v) < n.m && S.relics >= c) {S.relics -= c; S.rl[v] = RL(v) + 1; if (v == 'rMagic') S.magic = true;} } if (a == 'tab') tab = v;
        if (a == 'tr') {const n = NODE[v], c = cost(n); const needsMagic = ['arcana', 'mender', 'frost'].includes(v); if (can(n) && L(v) < n.m && S.gold >= c && (!needsMagic || hasMagic())) {S.gold -= c; S.tr[v] = L(v) + 1} }

        if (a == 'magic' && !hasMagic() && S.gold >= 300 && S.best >= 6) {S.gold -= 300; S.magic = true}
        if (a == 'bp') {S.gold -= PET[v].cost; S.pets[v].own = 1; S.ap = +v} if (a == 'ap') S.ap = +v;
        if (a == 'pl' && S.gold >= petLc(+v)) {S.gold -= petLc(+v); S.pets[v].lvl++}
        save(); camp()
      }
    });
    load(); view(); requestAnimationFrame(loop);
  </script>
